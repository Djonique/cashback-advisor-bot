spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME:cashback}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.djonique.cashbackadvbot: DEBUG
