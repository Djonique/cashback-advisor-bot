spring:
  application:
    name: cashback-advisor-bot

  # Подключение к PostgreSQL (Docker)
  datasource:
    url: jdbc:postgresql://localhost:5432/cashback
    username: cashback
    password: cashback
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: CashbackAdvBot

logging:
  level:
    root: INFO
    com.djonique.cashback_advisor_bot: DEBUG