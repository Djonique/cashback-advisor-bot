spring:
  application:
    name: cashback-advisor-bot

  # Подключение к PostgreSQL. В продакшене задайте переменные окружения.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cashback}
    username: ${DB_USERNAME:cashback}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  # SQL-логи включены в профиле local: --spring.profiles.active=local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Две задачи по расписанию не должны блокировать друг друга.
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: scheduling-

# Регистрацией бота управляет BotConfig, поэтому авто-конфигурация стартера отключена.
telegrambots:
  enabled: false

app:
  referral:
    tbank: "https://tbank-online.com/baf/1IFCQluGeyX"
    alfa: "https://alfa.me/IZguQD"
    vtb: "https://i.spbvtb.ru/bbct4b55"
    ozon: "https://ozon.ru/fintech/promo/ref/EOYON8JQH"
    yandex: "https://bank.yandex.ru/invite?refid=7U2phFHXdLi"
    wb: "https://www.wildberries.ru/wb-bank/reference/pr8I62sujQR7"
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    bot-username: ${TELEGRAM_BOT_USERNAME:CashbackAdvBot}
    payments:
      provider-token: ${TELEGRAM_PAYMENTS_TOKEN}
    # Отключите в тестах, чтобы не регистрировать бота в TelegramBotsApi.
    registration-enabled: true

logging:
  level:
    root: INFO
    com.djonique.cashbackadvbot: INFO
